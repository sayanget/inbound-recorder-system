<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang="page_title">运营指标分析</title>
    <link rel="icon" type="image/x-icon" href="/static/in0.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/nav_component.js"></script>
    <style>
        /* Modern Premium Style overrides and specific rules */
        body {
            font-family: 'Outfit', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--body-bg);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: clamp(15px, 3vw, 30px);
        }

        /* Header controls styling with dynamic glow */
        .controls-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--card-shadow);
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            transition: var(--transition);
        }

        .controls-card:hover {
            box-shadow: 0 8px 30px var(--shadow-color);
            border-color: var(--primary-color);
        }

        .title-block h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .inputs-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-item label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .date-picker-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .date-input {
            padding: 8px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: 500;
            outline: none;
            transition: var(--transition);
        }

        .date-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
        }

        .btn-premium {
            padding: 8px 16px;
            border-radius: var(--radius-md);
            border: none;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.25);
            transition: var(--transition);
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
        }

        .btn-premium:active {
            transform: translateY(0);
        }

        .btn-secondary {
            padding: 8px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-secondary:hover {
            background-color: var(--table-stripe);
            border-color: var(--primary-color);
        }

        /* Stats Window Mode Segment Buttons */
        .stats-window-seg {
            display: inline-flex;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            background-color: var(--table-header-bg);
        }

        .stats-window-seg .segment-btn {
            border: none;
            background: transparent;
            color: var(--text-color);
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .stats-window-seg .segment-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            box-shadow: 0 2px 10px rgba(67, 97, 238, 0.2);
        }

        .stats-window-seg .segment-btn:not(.active):hover {
            background-color: var(--border-color);
        }

        /* High-level Summary Cards Grid */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .summary-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--card-shadow);
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary-color);
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
        }

        .summary-card.success-accent::before { background: var(--success-color); }
        .summary-card.warning-accent::before { background: var(--warning-color); }
        .summary-card.info-accent::before { background: var(--info-color); }

        .summary-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px var(--shadow-color);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-val {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-color);
            line-height: 1.2;
        }

        .card-val span {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-left: 5px;
        }

        .card-icon {
            font-size: 2.2rem;
            color: var(--primary-color);
            opacity: 0.85;
            transition: var(--transition);
        }

        .summary-card:hover .card-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .summary-card.success-accent .card-icon { color: var(--success-color); }
        .summary-card.warning-accent .card-icon { color: var(--warning-color); }
        .summary-card.info-accent .card-icon { color: var(--info-color); }

        /* Table Control Bar styling */
        .table-actions-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md) var(--radius-md) 0 0;
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border-bottom: none;
        }

        .search-box-wrapper {
            position: relative;
            max-width: 350px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            border-radius: var(--radius-md);
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .export-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Sticky Matrix Table */
        .table-wrapper {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        .table-responsive {
            overflow-x: auto;
            max-height: clamp(400px, 60vh, 750px);
            position: relative;
        }

        /* Custom Scrollbar for premium look */
        .table-responsive::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-responsive::-webkit-scrollbar-track {
            background: var(--body-bg);
        }

        .table-responsive::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .table-responsive::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }

        .matrix-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: right;
        }

        .matrix-table th,
        .matrix-table td {
            padding: 10px 14px;
            font-size: 0.88rem;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .matrix-table th {
            font-weight: 700;
            background-color: var(--table-header-bg);
            color: var(--text-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Dynamic shadow border on scroll for sticky header */
        .matrix-table th::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            border-bottom: 2px solid var(--border-color);
        }

        /* Leftmost sticky column styling */
        .matrix-table th:first-child,
        .matrix-table td:first-child {
            position: sticky;
            left: 0;
            z-index: 8;
            background-color: var(--card-bg);
            text-align: left;
            font-weight: 600;
            border-right: 2px solid var(--border-color);
        }

        .matrix-table th:first-child {
            z-index: 12;
            background-color: var(--table-header-bg);
        }

        .matrix-table tr:hover td:first-child {
            background-color: var(--table-stripe);
        }

        /* Table header group separators (Centers vs Sites) */
        .section-header-row td {
            background: linear-gradient(90deg, rgba(67, 97, 238, 0.08), transparent) !important;
            text-align: left !important;
            font-weight: 800 !important;
            font-size: 0.95rem !important;
            color: var(--primary-color) !important;
            padding: 12px 16px !important;
            border-bottom: 2px solid rgba(67, 97, 238, 0.2) !important;
            letter-spacing: 0.02em;
        }

        .section-header-row td i {
            margin-right: 8px;
        }

        /* Subtotal and Grandtotal rows styling */
        .subtotal-row td {
            font-weight: 700 !important;
            background-color: rgba(254, 243, 199, 0.3) !important; /* light yellow tint */
            border-top: 1.5px solid var(--border-color);
            border-bottom: 2px solid var(--border-color);
        }

        [data-theme="dark"] .subtotal-row td {
            background-color: rgba(254, 243, 199, 0.06) !important;
        }

        .grandtotal-row td {
            font-weight: 800 !important;
            background-color: rgba(67, 97, 238, 0.08) !important; /* Primary color tint */
            font-size: 0.92rem;
            border-top: 2px solid var(--primary-color) !important;
            border-bottom: 2px solid var(--primary-color) !important;
        }

        /* Total Column highlight */
        .total-column-cell {
            font-weight: 700;
            background-color: rgba(254, 243, 199, 0.15);
        }

        .subtotal-row td.total-column-cell {
            background-color: rgba(254, 243, 199, 0.5) !important;
        }

        .grandtotal-row td.total-column-cell {
            background-color: rgba(67, 97, 238, 0.15) !important;
            color: var(--primary-color);
        }

        /* Highlight Peak cells in table */
        .peak-cell {
            font-weight: 700;
            color: var(--primary-color);
            background-color: rgba(67, 97, 238, 0.04);
        }

        /* Empty state styling */
        .empty-state {
            padding: 80px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 4rem;
            color: var(--border-color);
            animation: pulse 2s infinite;
        }

        /* Loader Spinner overlay */
        .spinner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.7);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        [data-theme="dark"] .spinner-overlay {
            background-color: rgba(15, 23, 42, 0.7);
        }

        .spinner-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Sleek Toast notifications */
        #toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            background-color: var(--card-bg);
            color: var(--text-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            z-index: 99999;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
            font-weight: 600;
            font-size: 0.9rem;
            align-items: center;
            gap: 10px;
        }

        #toast-notification.show {
            transform: translateY(0);
            opacity: 1;
            display: flex;
        }

        #toast-notification.success {
            border-left: 4px solid var(--success-color);
        }

        #toast-notification.error {
            border-left: 4px solid var(--danger-color);
        }

        #toast-notification i {
            font-size: 1.1rem;
        }

        .toast-notification.success i { color: var(--success-color); }
        .toast-notification.error i { color: var(--danger-color); }

        /* Animations */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 0.9; }
            100% { transform: scale(1); opacity: 0.7; }
        }

        @keyframes fadeInUp {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .animate-fade-in {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Responsive overrides */
        @media (max-width: 768px) {
            .controls-card {
                flex-direction: column;
                align-items: stretch;
            }
            .inputs-group {
                flex-direction: column;
                align-items: stretch;
            }
            .stats-window-seg {
                justify-content: stretch;
            }
            .stats-window-seg .segment-btn {
                flex: 1;
                text-align: center;
                padding: 8px 10px;
            }
            .table-actions-panel {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box-wrapper {
                max-width: 100%;
            }
            .export-buttons {
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>
    <!-- Universal Sidebar Container -->
    <div id="nav-container"></div>

    <div class="main-container animate-fade-in">
        <!-- Controls Header Panel -->
        <header class="controls-card">
            <div class="title-block">
                <h2><i class="fas fa-chart-line animate-pulse"></i><span data-lang="page_title">运营指标分析</span></h2>
            </div>
            
            <div class="inputs-group">
                <!-- Date Picker -->
                <div class="control-item">
                    <label for="selectedDate" data-lang="date_label">选择日期:</label>
                    <div class="date-picker-wrapper">
                        <input type="date" id="selectedDate" class="date-input">
                    </div>
                    <button type="button" id="todayBtn" class="btn-secondary" style="padding: 7px 12px; font-size: 0.85rem;">
                        <i class="fas fa-calendar-day"></i> Today
                    </button>
                </div>

                <!-- Statistical Window Toggle -->
                <div class="control-item">
                    <label data-lang="window_label">统计时段:</label>
                    <div class="stats-window-seg" role="group" aria-label="Stats window mode">
                        <button type="button" id="windowCalendarBtn" class="segment-btn active" data-mode="calendar" data-lang="window_calendar">自然日 (0-24h)</button>
                        <button type="button" id="windowBusinessBtn" class="segment-btn" data-mode="business" data-lang="window_business">工作班 (5h-次日5h)</button>
                        <button type="button" id="windowSeventeenBtn" class="segment-btn" data-mode="seventeen" data-lang="window_seventeen">晚班 (17h-次日17h)</button>
                    </div>
                </div>

                <!-- Refresh Button -->
                <button type="button" id="refreshBtn" class="btn-premium">
                    <i class="fas fa-sync-alt"></i>
                    <span data-lang="refresh_btn">刷新</span>
                </button>
            </div>
        </header>

        <!-- KPI Cards Summary Section -->
        <section class="summary-grid">
            <div class="summary-card">
                <div class="card-info">
                    <span class="card-label" data-lang="card_center_total">目的中心总运单</span>
                    <div class="card-val" id="centerTotalCount">0<span>单</span></div>
                </div>
                <div class="card-icon"><i class="fas fa-warehouse"></i></div>
            </div>

            <div class="summary-card success-accent">
                <div class="card-info">
                    <span class="card-label" data-lang="card_site_total">目的站点总运单</span>
                    <div class="card-val" id="siteTotalCount">0<span>单</span></div>
                </div>
                <div class="card-icon"><i class="fas fa-map-marker-alt"></i></div>
            </div>

            <div class="summary-card warning-accent">
                <div class="card-info">
                    <span class="card-label" data-lang="card_grand_total">汇总总运单数</span>
                    <div class="card-val" id="grandTotalCount">0<span>单</span></div>
                </div>
                <div class="card-icon"><i class="fas fa-calculator"></i></div>
            </div>

            <div class="summary-card info-accent">
                <div class="card-info">
                    <span class="card-label" data-lang="card_peak_hour">峰值发货时段</span>
                    <div class="card-val" id="peakHourValue">-<span></span></div>
                </div>
                <div class="card-icon"><i class="fas fa-fire"></i></div>
            </div>
        </section>

        <!-- Table Control Actions panel -->
        <section class="table-actions-panel">
            <div class="search-box-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchBox" class="search-input" placeholder="搜索流向名称..." data-lang="search_placeholder">
            </div>
            
            <div class="export-buttons">
                <button type="button" id="copyTsvBtn" class="btn-secondary">
                    <i class="fas fa-copy"></i>
                    <span data-lang="copy_tsv">复制 TSV</span>
                </button>
                <button type="button" id="exportCsvBtn" class="btn-premium">
                    <i class="fas fa-file-csv"></i>
                    <span data-lang="export_csv">导出 CSV</span>
                </button>
            </div>
        </section>

        <!-- Main table display -->
        <section class="table-wrapper">
            <div class="table-responsive" id="tableContainer">
                <!-- Loader Spinner overlay -->
                <div class="spinner-overlay" id="loadingSpinner">
                    <div class="spinner"></div>
                </div>

                <table class="matrix-table" id="matrixTable">
                    <thead>
                        <!-- Head is built dynamically -->
                    </thead>
                    <tbody>
                        <!-- Body is built dynamically -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Custom elegant Toast element -->
    <div id="toast-notification"></div>

    <script>
        // Multi-language Translation dictionary
        const translations = {
            zh: {
                page_title: "运营指标分析",
                operations_metrics: "运营指标",
                table_title: "流向集包进度",
                search_placeholder: "搜索目的地名称...",
                date_label: "选择日期:",
                window_label: "统计时段:",
                window_calendar: "自然日 (0-24h)",
                window_business: "工作班 (5h-次日5h)",
                window_seventeen: "晚班 (17h-次日17h)",
                centers_section: "目的中心",
                sites_section: "目的站点",
                col_destin: "目的地",
                col_total: "累计",
                row_sum: "合计",
                grand_sum: "总累计",
                empty_data: "暂无数据",
                card_center_total: "目的中心总运单",
                card_site_total: "目的站点总运单",
                card_grand_total: "汇总总运单数",
                card_peak_hour: "峰值发货时段",
                export_csv: "导出 CSV",
                copy_tsv: "复制 TSV",
                copy_success: "复制 TSV 成功！可直接粘贴至 Excel/Google Sheets",
                copy_failed: "复制失败，请重试",
                refresh_btn: "刷新",
                total_suffix: "单",
                no_data: "无匹配流向数据"
            },
            en: {
                page_title: "Operations Metrics Analysis",
                operations_metrics: "Ops Metrics",
                table_title: "Flow Bagging Progress",
                search_placeholder: "Search destination...",
                date_label: "Date:",
                window_label: "Stats Window:",
                window_calendar: "Calendar Day (0-24h)",
                window_business: "Shift Day (5am-5am)",
                window_seventeen: "Evening Shift (5pm-5pm)",
                centers_section: "Destination Centers",
                sites_section: "Destination Sites",
                col_destin: "Destination",
                col_total: "Total",
                row_sum: "Subtotal",
                grand_sum: "Grand Total",
                empty_data: "No data available",
                card_center_total: "Center Total Waybills",
                card_site_total: "Site Total Waybills",
                card_grand_total: "Grand Total Waybills",
                card_peak_hour: "Peak Shipping Hour",
                export_csv: "Export CSV",
                copy_tsv: "Copy TSV",
                copy_success: "TSV Copied! Paste directly to Excel/Google Sheets",
                copy_failed: "Copy failed, please retry",
                refresh_btn: "Refresh",
                total_suffix: "pcs",
                no_data: "No matching destination found"
            }
        };

        // Application State variables
        let currentLang = 'zh';
        let selectedDate = '';
        let statsWindowMode = 'calendar';
        
        let rawCenterData = null;
        let rawSiteData = null;
        
        let filteredCenters = [];
        let filteredSites = [];
        let commonHours = [];

        // Date Utilities
        function formatLocalYmd(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function getDefaultStatsAnchorYmd() {
            const now = new Date();
            // Working Shift (5am anchor)
            if (statsWindowMode === 'business' && now.getHours() < 5) {
                const prev = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
                return formatLocalYmd(prev);
            }
            // Evening Shift (5pm anchor)
            if (statsWindowMode === 'seventeen' && now.getHours() < 17) {
                const prev = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
                return formatLocalYmd(prev);
            }
            return formatLocalYmd(now);
        }

        // Custom premium toast notifications
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast-notification');
            if (!toast) return;
            
            toast.className = `toast-message ${type} show`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> <span>${message}</span>`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // Multilanguage setting function
        window.setLanguage = function(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            
            // Translate tags
            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.getAttribute('data-lang');
                const translation = translations[lang][key];
                if (translation) {
                    if (el.tagName === 'INPUT' && el.placeholder) {
                        el.placeholder = translation;
                    } else {
                        el.textContent = translation;
                    }
                }
            });

            // Specific updates
            document.title = translations[lang].page_title;
            
            // Re-render display suffix for cards
            updateKpiCards();
            
            // Re-draw table to update table-specific translation labels
            renderTable();

            // Set sidebar active class
            localStorage.setItem('preferred_language', lang);
        };

        // Show/Hide table loading spinner
        function toggleSpinner(show) {
            const spinner = document.getElementById('loadingSpinner');
            if (spinner) {
                if (show) spinner.classList.add('show');
                else spinner.classList.remove('show');
            }
        }

        // Build parameters with relative stats_window helper
        function buildApiUrl(path, params) {
            const url = new URL(path, window.location.origin);
            Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
            if (statsWindowMode) url.searchParams.append('stats_window', statsWindowMode);
            return url.toString();
        }

        // Parallel Fetch data from Backend APIs
        async function fetchMetricsData() {
            toggleSpinner(true);
            const dateInputVal = document.getElementById('selectedDate').value;
            selectedDate = dateInputVal;
            
            try {
                const params = { date: selectedDate };
                const centerUrl = buildApiUrl('/api/center_collect_trend', { ...params, destin_type: '1' });
                const siteUrl = buildApiUrl('/api/center_collect_trend', { ...params, destin_type: '2' });
                
                const [centerRes, siteRes] = await Promise.all([
                    fetch(centerUrl),
                    fetch(siteUrl)
                ]);
                
                if (!centerRes.ok || !siteRes.ok) {
                    throw new Error('API fetch failed');
                }
                
                rawCenterData = await centerRes.json();
                rawSiteData = await siteRes.json();
                
                processData();
            } catch (error) {
                console.error('Error fetching data:', error);
                showToast(currentLang === 'zh' ? '数据加载失败，请检查网络或刷新重试' : 'Failed to load data, please try refreshing', 'error');
                rawCenterData = null;
                rawSiteData = null;
                processData();
            } finally {
                toggleSpinner(false);
            }
        }

        // Data Processing (Alignment, calculations, sorting)
        function processData() {
            filteredCenters = [];
            filteredSites = [];
            commonHours = [];

            // Align times based on responses
            const centerHours = (rawCenterData && rawCenterData.dates) || [];
            const siteHours = (rawSiteData && rawSiteData.dates) || [];
            
            // Merge dates in order, resolving duplicates
            const allHoursSet = new Set([...centerHours, ...siteHours]);
            commonHours = Array.from(allHoursSet);
            // Sort hours chronologically (in format MM-DD HH:00 or HH:00)
            commonHours.sort();

            const hourToIndexMap = {};
            commonHours.forEach((hr, i) => { hourToIndexMap[hr] = i; });

            // Helper to build aligned row objects
            const buildAlignedRows = (rawApiData) => {
                if (!rawApiData || !rawApiData.series || rawApiData.series.length === 0) return [];
                
                const responseDates = rawApiData.dates || [];
                return rawApiData.series.map(s => {
                    const hourlyData = new Array(commonHours.length).fill(0);
                    // Match original series index data back to unified commonHours indices
                    if (s.data && s.data.length > 0) {
                        s.data.forEach((val, originalIdx) => {
                            const originalHour = responseDates[originalIdx];
                            if (originalHour && hourToIndexMap[originalHour] !== undefined) {
                                const newIdx = hourToIndexMap[originalHour];
                                hourlyData[newIdx] = +val || 0;
                            }
                        });
                    }
                    const total = hourlyData.reduce((sum, v) => sum + v, 0);
                    return {
                        name: s.label || '',
                        hourly: hourlyData,
                        total: total
                    };
                });
            };

            filteredCenters = buildAlignedRows(rawCenterData);
            filteredSites = buildAlignedRows(rawSiteData);

            // Sort descending by row total count
            filteredCenters.sort((a, b) => b.total - a.total);
            filteredSites.sort((a, b) => b.total - a.total);

            // Dynamic filter search term
            applyFilter();
        }

        // Apply dynamic search string
        function applyFilter() {
            const searchVal = document.getElementById('searchBox').value.trim().toLowerCase();
            
            let dispCenters = filteredCenters;
            let dispSites = filteredSites;

            if (searchVal) {
                dispCenters = filteredCenters.filter(c => c.name.toLowerCase().includes(searchVal));
                dispSites = filteredSites.filter(s => s.name.toLowerCase().includes(searchVal));
            }

            // Render Table and update high level stats dynamically
            updateKpiCards(dispCenters, dispSites);
            renderTableContent(dispCenters, dispSites);
        }

        // Render KPI Card summaries
        function updateKpiCards(centers = filteredCenters, sites = filteredSites) {
            const t = translations[currentLang];
            const suffix = t.total_suffix || '单';

            // Calculate sums
            const centerSum = centers.reduce((sum, c) => sum + c.total, 0);
            const siteSum = sites.reduce((sum, s) => sum + s.total, 0);
            const grandSum = centerSum + siteSum;

            // Render text
            document.getElementById('centerTotalCount').innerHTML = `${centerSum.toLocaleString()}<span>${suffix}</span>`;
            document.getElementById('siteTotalCount').innerHTML = `${siteSum.toLocaleString()}<span>${suffix}</span>`;
            document.getElementById('grandTotalCount').innerHTML = `${grandSum.toLocaleString()}<span>${suffix}</span>`;

            // Calculate Peak Hour & peak volume across all centers & sites dynamically
            let peakHour = '-';
            let peakValue = 0;

            if (commonHours.length > 0) {
                const hourlySums = new Array(commonHours.length).fill(0);
                
                centers.forEach(c => {
                    c.hourly.forEach((v, idx) => { hourlySums[idx] += v; });
                });
                sites.forEach(s => {
                    s.hourly.forEach((v, idx) => { hourlySums[idx] += v; });
                });

                let maxIdx = -1;
                hourlySums.forEach((sum, idx) => {
                    if (sum > peakValue) {
                        peakValue = sum;
                        maxIdx = idx;
                    }
                });

                if (maxIdx !== -1 && peakValue > 0) {
                    peakHour = commonHours[maxIdx];
                }
            }

            const peakValDisplay = peakValue > 0 ? `<span>(${peakValue.toLocaleString()}${suffix})</span>` : '';
            document.getElementById('peakHourValue').innerHTML = `${peakHour}${peakValDisplay}`;
        }

        // Render Aligned Table Content
        function renderTableContent(centers, sites) {
            const table = document.getElementById('matrixTable');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');
            thead.innerHTML = '';
            tbody.innerHTML = '';

            const t = translations[currentLang];

            // If empty columns or rows
            if (commonHours.length === 0 || (centers.length === 0 && sites.length === 0)) {
                thead.innerHTML = `<tr><th>${t.col_destin}</th><th>${t.col_total}</th></tr>`;
                tbody.innerHTML = `
                    <tr>
                        <td colspan="2" class="empty-state">
                            <i class="fas fa-folder-open empty-state-icon"></i>
                            <span>${t.no_data}</span>
                        </td>
                    </tr>
                `;
                return;
            }

            // 1. Build Header
            let headHtml = `<tr><th>${t.col_destin}</th>`;
            commonHours.forEach(hr => {
                headHtml += `<th>${hr}</th>`;
            });
            headHtml += `<th class="total-column-cell">${t.col_total}</th></tr>`;
            thead.innerHTML = headHtml;

            // Compute peak hourly indices for each row to apply peak highlighting
            const getPeakHourIndex = (hourlyArray) => {
                let maxVal = -1;
                let maxIdx = -1;
                hourlyArray.forEach((v, idx) => {
                    if (v > maxVal && v > 0) {
                        maxVal = v;
                        maxIdx = idx;
                    }
                });
                return maxIdx;
            };

            let bodyHtml = '';

            // Helper to generate section body
            const addSectionRows = (sectionName, rowList, sectionIcon) => {
                if (rowList.length === 0) return;

                // Section header row
                bodyHtml += `
                    <tr class="section-header-row">
                        <td colspan="${commonHours.length + 2}"><i class="fas ${sectionIcon}"></i>${sectionName} (${rowList.length})</td>
                    </tr>
                `;

                // Add each row
                rowList.forEach(r => {
                    const peakIdx = getPeakHourIndex(r.hourly);
                    bodyHtml += `<tr><td>${r.name}</td>`;
                    r.hourly.forEach((v, idx) => {
                        const isPeak = idx === peakIdx;
                        const tdClass = isPeak ? 'class="peak-cell"' : '';
                        bodyHtml += `<td ${tdClass}>${v > 0 ? v.toLocaleString() : '<span style="color:var(--text-muted); opacity: 0.5;">-</span>'}</td>`;
                    });
                    bodyHtml += `<td class="total-column-cell">${r.total.toLocaleString()}</td></tr>`;
                });

                // Section Sub-total row
                const subSums = new Array(commonHours.length).fill(0);
                rowList.forEach(r => {
                    r.hourly.forEach((v, idx) => { subSums[idx] += v; });
                });
                const subTotalSum = subSums.reduce((sum, v) => sum + v, 0);

                bodyHtml += `<tr class="subtotal-row"><td>${t.row_sum} - ${sectionName}</td>`;
                subSums.forEach(v => {
                    bodyHtml += `<td>${v > 0 ? v.toLocaleString() : '-'}</td>`;
                });
                bodyHtml += `<td class="total-column-cell">${subTotalSum.toLocaleString()}</td></tr>`;
            };

            // 2. Render Destination Centers Section
            addSectionRows(t.centers_section, centers, 'fa-warehouse');

            // 3. Render Destination Sites Section
            addSectionRows(t.sites_section, sites, 'fa-map-marker-alt');

            // 4. Render Grand Total Row
            const grandHourlySums = new Array(commonHours.length).fill(0);
            centers.forEach(c => {
                c.hourly.forEach((v, idx) => { grandHourlySums[idx] += v; });
            });
            sites.forEach(s => {
                s.hourly.forEach((v, idx) => { grandHourlySums[idx] += v; });
            });
            const grandTotalSum = grandHourlySums.reduce((sum, v) => sum + v, 0);

            bodyHtml += `<tr class="grandtotal-row"><td>${t.grand_sum}</td>`;
            grandHourlySums.forEach(v => {
                bodyHtml += `<td>${v > 0 ? v.toLocaleString() : '-'}</td>`;
            });
            bodyHtml += `<td class="total-column-cell">${grandTotalSum.toLocaleString()}</td></tr>`;

            tbody.innerHTML = bodyHtml;
        }

        // Just trigger standard rendering on translation update
        function renderTable() {
            applyFilter();
        }

        // ================= CSV/TSV Export Helpers =================
        function generateExportMatrix(centers, sites) {
            const t = translations[currentLang];
            const matrix = [];
            
            // Header Row
            const header = [t.col_destin, ...commonHours, t.col_total];
            matrix.push(header);

            // Helper to append section rows
            const appendSection = (sectionName, list) => {
                if (list.length === 0) return;
                
                // Section Title line
                matrix.push([`=== ${sectionName} ===`]);

                // Item rows
                list.forEach(r => {
                    matrix.push([r.name, ...r.hourly, r.total]);
                });

                // Subtotal row
                const subSums = new Array(commonHours.length).fill(0);
                list.forEach(r => {
                    r.hourly.forEach((v, idx) => { subSums[idx] += v; });
                });
                const subTotalSum = subSums.reduce((sum, v) => sum + v, 0);
                matrix.push([`${t.row_sum} (${sectionName})`, ...subSums, subTotalSum]);
            };

            // Centers
            appendSection(t.centers_section, centers);
            // Sites
            appendSection(t.sites_section, sites);

            // Grand Total row
            const grandHourlySums = new Array(commonHours.length).fill(0);
            centers.forEach(c => {
                c.hourly.forEach((v, idx) => { grandHourlySums[idx] += v; });
            });
            sites.forEach(s => {
                s.hourly.forEach((v, idx) => { grandHourlySums[idx] += v; });
            });
            const grandTotalSum = grandHourlySums.reduce((sum, v) => sum + v, 0);
            matrix.push([t.grand_sum, ...grandHourlySums, grandTotalSum]);

            return matrix;
        }

        // CSV Escape
        function csvEscapeCell(v) {
            if (v == null) return '';
            const s = String(v);
            if (/[",\r\n\t]/.test(s)) {
                return '"' + s.replace(/"/g, '""') + '"';
            }
            return s;
        }

        // Offline CSV Export with UTF-8 BOM
        function exportToCsv() {
            const searchVal = document.getElementById('searchBox').value.trim().toLowerCase();
            let centers = filteredCenters;
            let sites = filteredSites;

            if (searchVal) {
                centers = filteredCenters.filter(c => c.name.toLowerCase().includes(searchVal));
                sites = filteredSites.filter(s => s.name.toLowerCase().includes(searchVal));
            }

            if (centers.length === 0 && sites.length === 0) {
                showToast(currentLang === 'zh' ? '无可导出的数据' : 'No data to export', 'error');
                return;
            }

            const matrix = generateExportMatrix(centers, sites);
            const csvLines = matrix.map(row => row.map(csvEscapeCell).join(',')).join('\r\n');
            
            // UTF-8 BOM so Excel decodes Chinese characters correctly
            const blob = new Blob(['\ufeff' + csvLines], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const dateStr = selectedDate || getDefaultStatsAnchorYmd();
            const filename = `flow_bagging_progress_${statsWindowMode}_${dateStr}.csv`;
            
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            
            setTimeout(() => {
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }, 300);
            
            showToast(currentLang === 'zh' ? 'CSV 导出成功！' : 'CSV Exported successfully!');
        }

        // Offline TSV Clipboard Copy
        async function copyToTsvClipboard() {
            const searchVal = document.getElementById('searchBox').value.trim().toLowerCase();
            let centers = filteredCenters;
            let sites = filteredSites;

            if (searchVal) {
                centers = filteredCenters.filter(c => c.name.toLowerCase().includes(searchVal));
                sites = filteredSites.filter(s => s.name.toLowerCase().includes(searchVal));
            }

            if (centers.length === 0 && sites.length === 0) {
                showToast(currentLang === 'zh' ? '无可复制的数据' : 'No data to copy', 'error');
                return;
            }

            const matrix = generateExportMatrix(centers, sites);
            // Build TSV content
            const tsvContent = matrix.map(row => row.join('\t')).join('\n');

            try {
                await navigator.clipboard.writeText(tsvContent);
                showToast(translations[currentLang].copy_success);
            } catch (err) {
                console.error('Failed to copy TSV:', err);
                showToast(translations[currentLang].copy_failed, 'error');
            }
        }

        // Event Listeners setup
        function initEventListeners() {
            // Segment statistical window controls
            document.querySelectorAll('.stats-window-seg .segment-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (this.classList.contains('active')) return;
                    
                    document.querySelectorAll('.stats-window-seg .segment-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    statsWindowMode = this.getAttribute('data-mode');
                    fetchMetricsData();
                });
            });

            // Date pickers
            const dateInput = document.getElementById('selectedDate');
            dateInput.addEventListener('change', fetchMetricsData);

            // Today button
            document.getElementById('todayBtn').addEventListener('click', () => {
                const todayStr = getDefaultStatsAnchorYmd();
                if (dateInput.value !== todayStr) {
                    dateInput.value = todayStr;
                    fetchMetricsData();
                }
            });

            // Refresh button
            document.getElementById('refreshBtn').addEventListener('click', fetchMetricsData);

            // Real-time filter search box
            document.getElementById('searchBox').addEventListener('input', applyFilter);

            // CSV Export
            document.getElementById('exportCsvBtn').addEventListener('click', exportToCsv);

            // TSV Clipboard Copy
            document.getElementById('copyTsvBtn').addEventListener('click', copyToTsvClipboard);

            // Listen for global theme language updates from Universal Navigation
            window.addEventListener('themeChanged', (e) => {
                // Keep themes aligned if charts or elements need manually repainted (e.c. canvas)
            });
        }

        // Initialize Page
        document.addEventListener('DOMContentLoaded', () => {
            // Set Default Date picker val
            const defaultDate = getDefaultStatsAnchorYmd();
            document.getElementById('selectedDate').value = defaultDate;
            
            // Set statsWindowMode default
            statsWindowMode = 'calendar';
            
            // Set current initial language from localStorage or navigation preference
            const preferredLang = localStorage.getItem('preferred_language') || 'zh';
            
            initEventListeners();
            
            // Initial translation and data loading
            setLanguage(preferredLang);
            fetchMetricsData();
        });
    </script>
</body>

</html>
