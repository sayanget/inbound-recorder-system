<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbound System | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Plus+Jakarta+Sans:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: oklch(98% 0.01 80);
            --text-main: oklch(20% 0.02 240);
            --accent: oklch(55% 0.15 50);
            --accent-hover: oklch(50% 0.15 50);
            --line: oklch(85% 0.01 240);
            --error: oklch(55% 0.2 20);
            --transition-main: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }

        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
        }

        /* Form Side */
        .form-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(2rem, 8vw, 6rem);
            background: var(--bg);
            position: relative;
            z-index: 2;
        }

        .header {
            margin-bottom: 4rem;
            overflow: hidden;
        }

        .header h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 300;
            line-height: 1.1;
            transform: translateY(100%);
            animation: slideIn var(--transition-main) forwards;
        }

        .login-form {
            max-width: 400px;
            width: 100%;
            opacity: 0;
            animation: fadeIn var(--transition-main) 0.3s forwards;
        }

        .input-group {
            position: relative;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--line);
            transition: border-color var(--transition-main);
        }

        .input-group:focus-within {
            border-color: var(--accent);
        }

        .input-group label {
            position: absolute;
            left: 0;
            top: 12px;
            font-size: 1rem;
            font-weight: 300;
            pointer-events: none;
            transition: all var(--transition-main);
            opacity: 0.6;
        }

        .input-group input {
            width: 100%;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 1.1rem;
            font-family: inherit;
            color: var(--text-main);
            outline: none;
        }

        .input-group input:focus+label,
        .input-group input:not(:placeholder-shown)+label {
            top: -20px;
            font-size: 0.75rem;
            color: var(--accent);
            opacity: 1;
        }

        .submit-btn {
            display: flex;
            width: 100%;
            padding: 1.25rem;
            background: var(--accent);
            color: white;
            border: none;
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all var(--transition-main);
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: var(--error);
            font-size: 0.875rem;
            min-height: 1.25rem;
            margin-top: 1rem;
            font-weight: 500;
        }

        /* Visual Side */
        .visual-side {
            position: relative;
            background: #111;
            overflow: hidden;
        }

        .visual-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(0.2) contrast(1.1);
            opacity: 0.8;
            transform: scale(1.1);
            animation: zoomOut 1.5s var(--transition-main) forwards;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, var(--bg) 0%, transparent 15%);
        }

        /* Language Switcher */
        .i18n-switcher {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            display: flex;
            gap: 1.5rem;
        }

        .lang-btn {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-main);
            opacity: 0.4;
            cursor: pointer;
            transition: opacity 0.3s;
            text-transform: uppercase;
        }

        .lang-btn.active {
            opacity: 1;
            border-bottom: 1px solid var(--accent);
        }

        /* Animations */
        @keyframes slideIn {
            to {
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes zoomOut {
            to {
                transform: scale(1);
            }
        }

        @media (max-width: 900px) {
            .split-layout {
                grid-template-columns: 1fr;
            }

            .visual-side {
                display: none;
            }

            .form-side {
                padding: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="split-layout">
        <div class="form-side">
            <div class="header">
                <h1 id="title_login">账户登录</h1>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <input type="text" id="username" placeholder=" " required autofocus>
                    <label for="username" id="label_username">用户名</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder=" " required>
                    <label for="password" id="label_password">密码</label>
                </div>

                <button type="submit" class="submit-btn" id="btn_login">登录</button>
                <div id="message" class="error-message"></div>
            </form>

            <div class="i18n-switcher">
                <button class="lang-btn active" onclick="setLang('zh')" id="lang_zh">CN</button>
                <button class="lang-btn" onclick="setLang('en')" id="lang_en">EN</button>
                <button class="lang-btn" onclick="setLang('es')" id="lang_es">ES</button>
            </div>
        </div>
        <div class="visual-side">
            <img src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=2070&auto=format&fit=crop"
                alt="Warehouse">
            <div class="overlay"></div>
        </div>
    </div>

    <script>
        const translations = {
            zh: {
                title_login: '账户登录',
                label_username: '用户名',
                label_password: '密码',
                btn_login: '登录',
                loading: '正在登录...',
                err_empty: '请输入用户名和密码',
                err_network: '登录失败，请检查网络连接',
                success: '登录成功，正在跳转...'
            },
            en: {
                title_login: 'Account Login',
                label_username: 'Username',
                label_password: 'Password',
                btn_login: 'Login',
                loading: 'Logging in...',
                err_empty: 'Please enter username and password',
                err_network: 'Login failed, please check network',
                success: 'Login success, redirecting...'
            },
            es: {
                title_login: 'Iniciar Sesión',
                label_username: 'Usuario',
                label_password: 'Contraseña',
                btn_login: 'Entrar',
                loading: 'Iniciando...',
                err_empty: 'Por favor ingrese usuario y contraseña',
                err_network: 'Error de inicio de sesión',
                success: 'Éxito, redirigiendo...'
            }
        };

        let currentLang = 'zh';

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.id === `lang_${lang}`);
            });

            for (let id in translations[lang]) {
                const el = document.getElementById(id);
                if (el) el.textContent = translations[lang][id];
            }
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
        }

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('btn_login');
        const messageDiv = document.getElementById('message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageDiv.textContent = '';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const t = translations[currentLang];

            if (!username || !password) {
                messageDiv.textContent = t.err_empty;
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = t.loading;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    messageDiv.style.color = 'var(--accent)';
                    messageDiv.textContent = t.success;
                    setTimeout(() => {
                        window.location.href = data.redirect || '/';
                    }, 800);
                } else {
                    messageDiv.style.color = 'var(--error)';
                    messageDiv.textContent = data.error || 'Login Error';
                    loginBtn.disabled = false;
                    loginBtn.textContent = t.btn_login;
                }
            } catch (error) {
                messageDiv.style.color = 'var(--error)';
                messageDiv.textContent = t.err_network;
                loginBtn.disabled = false;
                loginBtn.textContent = t.btn_login;
            }
        });

        // initial check
        fetch('/api/check_login')
            .then(r => r.json())
            .then(data => { if (data.logged_in) window.location.href = '/'; });
    </script>
</body>

</html>
